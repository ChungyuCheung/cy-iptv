name: 每小时自动测活并更新直播源

on:
  schedule:
    # 每小时第 15 分钟运行一次（避开全球整点高峰，保障准时推送）
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 执行直播源测活与测速排序
      id: check
      run: |
        python tools/auto_update.py

    - name: 提交并同步推送到 main 与 master 分支
      id: push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        if [ -z "$(git status --porcelain tv/)" ]; then
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 播放源无变更，无需提交"
          exit 0
        fi

        git add tv/
        git commit -m "chore(auto): 每小时自动巡检查活并更新直播源 [skip ci]"

        for attempt in 1 2 3; do
          git fetch origin main
          if ! git rebase origin/main; then
            echo "⚠️ rebase 冲突，丢弃本地生成文件，基于最新 main 重新生成"
            git rebase --abort || true
            git reset --hard origin/main
            python tools/auto_update.py
            if [ -z "$(git status --porcelain tv/)" ]; then
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              echo "ℹ️ 最新 main 已包含相同播放源，无需提交"
              exit 0
            fi
            git add tv/
            git commit -m "chore(auto): 每小时自动巡检查活并更新直播源 [skip ci]"
          fi
          if git push origin HEAD:main; then
            git push origin HEAD:master || true
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "✅ 播放源已 rebase 并推送到远程分支（第 ${attempt} 次尝试）"
            exit 0
          fi
          echo "⚠️ 第 ${attempt} 次推送失败，稍后重试"
          sleep $((attempt * 5))
        done
        echo "❌ 推送 3 次均失败"
        exit 1

    - name: 巡检失败时推送 Telegram 通知
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "未配置 Telegram，跳过通知"
          exit 0
        fi
        now_str=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
        check_outcome="${{ steps.check.outcome }}"
        push_outcome="${{ steps.push.outcome }}"
        if [ "$check_outcome" != "success" ]; then
          detail="测活步骤未成功（${check_outcome}），未推送。"
        elif [ "$push_outcome" != "success" ]; then
          detail="推送到 main 未成功（${push_outcome}），仓库未同步。"
        else
          detail="巡检任务失败，请查看 Actions 日志。"
        fi
        q='`'
        text=$(printf '%s\n' \
          "📢 *CY-IPTV 巡检失败*" \
          "" \
          "⏱ *时间*: ${q}${now_str}${q}" \
          "🔴 *原因*: ${detail}")
        echo "----- TELEGRAM TEXT -----"
        printf '%s\n' "$text"
        echo "----- END TELEGRAM TEXT -----"
        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${text}"
