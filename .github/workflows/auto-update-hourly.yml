name: 每小时自动测活并更新直播源

on:
  schedule:
    # 国际标准时间每小时第 0 分钟触发（对应北京时间每小时整点）
    - cron: '0 * * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动点击触发

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出当前仓库代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 执行直播源测活与自动重构
      run: |
        python tools/auto_update.py

    - name: 提交并推送到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有文件更新
        if [ -n "$(git status --porcelain)" ]; then
          git add tv/
          git commit -m "chore(auto): 每小时自动巡检查活并更新有效直播源 [skip ci]"
          git push origin master
          echo "✅ 检测到播放源变动，已自动推送到 master 分支"
        else
          echo "ℹ️ 所有播放源状态良好，无需更新提交"
        fi
