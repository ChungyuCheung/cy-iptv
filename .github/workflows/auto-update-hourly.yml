name: 每小时自动测活并更新直播源

on:
  schedule:
    # 每小时第 15 分钟运行一次（避开全球整点高峰，保障准时推送）
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 执行直播源测活与测速排序
      id: check
      run: |
        python tools/auto_update.py

    - name: 提交并同步推送到 main 与 master 分支
      id: push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        if [ -n "$(git status --porcelain)" ]; then
          git add tv/
          git commit -m "chore(auto): 每小时自动巡检查活并更新直播源 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:master || true
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 播放源已 rebase 并推送到远程分支"
        else
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 播放源无变更，无需提交"
        fi

    - name: 按实际结果推送 Telegram 通知
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "未配置 Telegram，跳过通知"
          exit 0
        fi
        check_outcome="${{ steps.check.outcome }}"
        push_outcome="${{ steps.push.outcome }}"
        pushed="${{ steps.push.outputs.pushed }}"
        if [ "$check_outcome" != "success" ]; then
          text="CY-IPTV 巡检失败：测活步骤未成功（${check_outcome}），未推送。"
        elif [ "$push_outcome" != "success" ]; then
          text="CY-IPTV 巡检失败：推送到 main 未成功（${push_outcome}），仓库未同步。"
        else
          now_str=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
          total=$(grep -E ',.+' tv/favorites.txt | grep -vc '#genre#' || true)
          if [ "$pushed" = "true" ]; then
            tail_line="🚀 *已自动同步至 GitHub 仓库分支！*"
          else
            tail_line="ℹ️ *播放源无变更，仓库已是最新。*"
          fi
          q='`'
          render_body() {
            awk -v mode="$1" -v q="$q" '
          function trimpath(p,    n, a, i, out, k) {
            if (p == "") return ""
            n = split(p, a, "/")
            while (n > 0 && a[n] == "") n--
            while (n > 0 && (a[n] ~ /^(master|index|playlist)\.m3u8$/ || a[n] ~ /^chunklist/)) n--
            while (n > 0 && (a[n] ~ /^[0-9a-fA-F]{24,}(\.m3u8)?$/)) n--
            k = n - 2
            if (k < 1) k = 1
            out = ""
            for (i = k; i <= n; i++) {
              if (a[i] == "") continue
              out = (out == "" ? a[i] : out "/" a[i])
            }
            if (out ~ /^(stream|hls|live|channel|TVOD|play)$/) out = ""
            if (length(out) > 42) {
              out = a[n]
              if (length(out) > 24) out = substr(out, 1, 24)
            }
            return out
          }
          function classify(name) {
            if (index(name, "TVB Plus") > 0) return "plus"
            if (index(name, "无线新闻") > 0) return "news"
            if (name == "TVBS 新闻台" || name == "TVBS Asia" || name == "台视新闻" || name == "三立戏剧台" || name == "八大戏剧台" || name == "纬来精采台" || name == "人间卫视" || index(name, "TVBS") == 1) return "tw"
            if (index(name, "翡翠台") > 0 || index(name, "TVB") > 0) return "tvb"
            if (name == "CCTV5" || name == "CCTV5+") return "cctv"
            return "other"
          }
          function hostpath(url,    u, cut, hpos, host, path) {
            u = url
            sub(/^https?:\/\//, "", u)
            cut = index(u, "?")
            if (cut > 0) u = substr(u, 1, cut - 1)
            cut = index(u, "#")
            if (cut > 0) u = substr(u, 1, cut - 1)
            hpos = index(u, "/")
            if (hpos == 0) {
              host = u
              path = ""
            } else {
              host = substr(u, 1, hpos - 1)
              path = substr(u, hpos + 1)
            }
            sub(/^.*@/, "", host)
            sub(/:[0-9]+$/, "", host)
            path = trimpath(path)
            return host SUBSEP path
          }
          BEGIN {
            order_n = split("tvb plus news cctv tw other", order, " ")
            label["tvb"] = "翡翠台 / TVB"
            label["plus"] = "TVB Plus"
            label["news"] = "无线新闻"
            label["cctv"] = "央视体育"
            label["tw"] = "台湾专区"
            label["other"] = "其他"
          }
          {
            gsub(/\r/, "", $0)
            line = $0
            sub(/^[ \t]+/, "", line)
            sub(/[ \t]+$/, "", line)
            if (line == "" || substr(line, 1, 1) == "#") next
            p = index(line, ",")
            if (p == 0) next
            name = substr(line, 1, p - 1)
            url = substr(line, p + 1)
            gsub(/^[ \t]+|[ \t]+$/, "", name)
            gsub(/^[ \t]+|[ \t]+$/, "", url)
            if (name == "" || url == "" || name ~ /#genre#/ || url ~ /#genre#/) next
            g = classify(name)
            hp = hostpath(url)
            split(hp, parts, SUBSEP)
            host = parts[1]
            path = parts[2]
            gsub(/[`*\r\n]/, "", name)
            gsub(/[`*\r\n]/, "", host)
            gsub(/[`*\r\n]/, "", path)
            cnt[g]++
            i = cnt[g]
            nm[g, i] = name
            hs[g, i] = host
            pt[g, i] = path
            key = name SUBSEP host SUBSEP path
            dup[key]++
          }
          END {
            out = ""
            rest = ""
            for (gi = 1; gi <= order_n; gi++) {
              g = order[gi]
              n = cnt[g] + 0
              if (n == 0) continue
              brief_rest = (mode == "brief" && (g == "cctv" || g == "tw" || g == "other"))
              if (brief_rest) {
                if (rest != "") rest = rest "、"
                rest = rest label[g] " " n " 条"
                continue
              }
              block = "📡 *" label[g] "*（" n " 条）"
              delete seen
              for (i = 1; i <= n; i++) {
                key = nm[g, i] SUBSEP hs[g, i] SUBSEP pt[g, i]
                seen[key]++
                desc = nm[g, i]
                if (hs[g, i] != "") desc = desc " · " hs[g, i]
                if (pt[g, i] != "") desc = desc " · " pt[g, i]
                if (dup[key] > 1) desc = desc " #" seen[key]
                block = block "\n  • " q desc q
              }
              if (out != "") out = out "\n\n"
              out = out block
            }
            if (rest != "") {
              if (out != "") out = out "\n\n"
              out = out "📡 *其余频道*: " rest
            }
            printf "%s", out
          }
            ' tv/favorites.txt
          }
          assemble() {
            text=$(printf '%s\n' \
              "📺 *CY-IPTV 自动巡检播报*" \
              "" \
              "⏱ *巡检时间*: ${q}${now_str}${q}" \
              "🟢 *测活状态*: 全部正常（共 ${total} 条可用线路）" \
              "" \
              "$1" \
              "" \
              "${tail_line}")
          }
          body=$(render_body full)
          assemble "$body"
          if [ "${#text}" -gt 3900 ]; then
            body=$(render_body brief)
            assemble "$body"
          fi
        fi
        echo "----- TELEGRAM TEXT -----"
        printf '%s\n' "$text"
        echo "----- END TELEGRAM TEXT -----"
        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${text}"
