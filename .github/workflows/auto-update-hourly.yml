name: 每小时自动测活并更新直播源

on:
  schedule:
    # 每小时第 15 分钟运行一次（避开全球整点高峰，保障准时推送）
    - cron: '15 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页端的 Actions 页面随时手动一键触发

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 执行直播源测活、测速排序与通知推送
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python tools/auto_update.py

    - name: 提交并同步推送到 main 与 master 分支
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有文件更新或时间戳更新
        if [ -n "$(git status --porcelain)" ]; then
          git add tv/
          git commit -m "chore(auto): 每小时自动巡检查活并更新直播源 [skip ci]"
          git push origin HEAD:main
          git push origin HEAD:master || true
          echo "✅ 播放源已自动更新并推送到远程分支"
        else
          echo "ℹ️ 所有播放源均正常，无需提交"
        fi
