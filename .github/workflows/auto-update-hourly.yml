name: 每小时自动测活并更新直播源

on:
  schedule:
    # 每小时第 15 分钟运行一次（避开全球整点高峰，保障准时推送）
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 设置 Python 运行环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 执行直播源测活与测速排序
      id: check
      run: |
        python tools/auto_update.py

    - name: 提交并同步推送到 main 与 master 分支
      id: push
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        if [ -n "$(git status --porcelain)" ]; then
          git add tv/
          git commit -m "chore(auto): 每小时自动巡检查活并更新直播源 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:master || true
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 播放源已 rebase 并推送到远程分支"
        else
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 播放源无变更，无需提交"
        fi

    - name: 按实际结果推送 Telegram 通知
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
          echo "未配置 Telegram，跳过通知"
          exit 0
        fi
        check_outcome="${{ steps.check.outcome }}"
        push_outcome="${{ steps.push.outcome }}"
        pushed="${{ steps.push.outputs.pushed }}"
        if [ "$check_outcome" != "success" ]; then
          text="CY-IPTV 巡检失败：测活步骤未成功（${check_outcome}），未推送。"
        elif [ "$push_outcome" != "success" ]; then
          text="CY-IPTV 巡检失败：推送到 main 未成功（${push_outcome}），仓库未同步。"
        else
          now_str=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
          total=$(grep -E ',.+' tv/favorites.txt | grep -vc '#genre#' || true)
          if [ "$pushed" = "true" ]; then
            tail_line="🚀 *已自动同步至 GitHub 仓库分支！*"
          else
            tail_line="ℹ️ *播放源无变更，仓库已是最新。*"
          fi
          q='`'
          body=$(awk '
            function rank(name) {
              if (index(name, "翡翠台") > 0) return 1
              if (index(name, "TVB Plus") > 0) return 2
              if (index(name, "无线新闻") > 0) return 3
              return 4
            }
            {
              gsub(/\r/, "", $0)
              line = $0
              sub(/^[ \t]+/, "", line)
              sub(/[ \t]+$/, "", line)
              if (line == "" || substr(line, 1, 1) == "#") next
              p = index(line, ",")
              if (p == 0) next
              name = substr(line, 1, p - 1)
              url = substr(line, p + 1)
              gsub(/^[ \t]+|[ \t]+$/, "", name)
              gsub(/^[ \t]+|[ \t]+$/, "", url)
              if (name == "" || url == "" || name ~ /#genre#/ || url ~ /#genre#/) next
              gsub(/[`*_\r\n]/, "", name)
              if (!(name in cnt)) {
                seq++
                order[seq] = name
                seen_at[name] = seq
              }
              cnt[name]++
            }
            END {
              out = ""
              for (pass = 0; pass <= 4; pass++) {
                for (i = 1; i <= seq; i++) {
                  name = order[i]
                  r = rank(name)
                  take = 0
                  if (pass == 0 && name == "翡翠台") take = 1
                  else if (pass == 1 && r == 1 && name != "翡翠台") take = 1
                  else if (pass == 2 && r == 2) take = 1
                  else if (pass == 3 && r == 3) take = 1
                  else if (pass == 4 && r == 4) take = 1
                  if (!take) continue
                  row = "· " name "：" cnt[name] " 条正常"
                  out = (out == "" ? row : out "\n" row)
                }
              }
              printf "%s", out
            }
          ' tv/favorites.txt)
          text=$(printf '%s\n' \
            "📺 *CY-IPTV 自动巡检播报*" \
            "" \
            "⏱ *巡检时间*: ${q}${now_str}${q}" \
            "🟢 *测活状态*: 全部正常（共 ${total} 条可用线路）" \
            "" \
            "$body" \
            "" \
            "${tail_line}")
          if [ "${#text}" -gt 3900 ]; then
            echo "警告: 播报超过 3900 字，仍列出全部频道及正常条数，未删减"
          fi
        fi
        echo "----- TELEGRAM TEXT -----"
        printf '%s\n' "$text"
        echo "----- END TELEGRAM TEXT -----"
        curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "parse_mode=Markdown" \
          --data-urlencode "text=${text}"
